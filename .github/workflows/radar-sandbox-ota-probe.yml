name: Radar Sandbox OTA Probe

on:
  push:
    branches: [feat/competitor-radar-testable-preview]
    paths: [.github/workflows/radar-sandbox-ota-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TEAM_ID: team_rtARGegsahiZ6hOY7l2dUWGw
      VERCEL_PROJECT_ID: prj_5a6ilBSvneWYIDTGoCFFZhAjWYeM
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install probe SDK
        run: |
          mkdir -p /tmp/radar-ota-probe
          cd /tmp/radar-ota-probe
          npm init -y >/dev/null
          npm install --save-exact @vercel/sandbox >/dev/null
      - name: Open dated Booking search and property detail
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: /tmp/radar-ota-probe
        run: |
          cat > probe.mjs <<'JS'
          import { Sandbox } from '@vercel/sandbox';
          import { writeFile } from 'node:fs/promises';
          const sandbox = await Sandbox.create({
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_TEAM_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
            source: { type: 'snapshot', snapshotId: 'snap_c3rDmQdTPMoDHIu55bxS3MruQxZz' },
            timeout: 6 * 60 * 1000,
            resources: { vcpus: 2 },
            networkPolicy: 'allow-all',
          });
          const evidence = { createdAt: new Date().toISOString(), steps: {} };
          async function cmd(args, limit = 240000) {
            const c = await sandbox.runCommand({ cmd: 'agent-browser', args });
            return { exitCode: c.exitCode, stdout: (await c.stdout()).slice(0, limit), stderr: (await c.stderr()).slice(0, 5000) };
          }
          async function js(source, limit) { return cmd(['eval', source], limit); }
          try {
            const params = new URLSearchParams({
              ss: '水芳',
              checkin: '2026-09-28',
              checkout: '2026-09-29',
              group_adults: '2',
              group_children: '0',
              no_rooms: '1',
              selected_currency: 'TWD',
              changed_currency: '1',
              lang: 'zh-tw',
            });
            const searchUrl = `https://www.booking.com/searchresults.zh-tw.html?${params}`;
            evidence.steps.open = await cmd(['open', searchUrl]);
            await cmd(['wait', '--load', 'networkidle']);
            await cmd(['wait', '7000']);
            evidence.steps.search = await js(`JSON.stringify({
              url: location.href,
              title: document.title,
              dateButtons: [...document.querySelectorAll('button')].map(b=>(b.innerText||b.getAttribute('aria-label')||'').trim()).filter(t=>/9 月|入住日|退房日/.test(t)).slice(0,12),
              currency: [...document.querySelectorAll('button')].map(b=>(b.getAttribute('aria-label')||b.innerText||'').trim()).filter(t=>/價格為|TWD|新臺幣|USD/.test(t)).slice(0,12),
              cards: [...document.querySelectorAll('[data-testid="property-card"]')].map((card,index)=>({
                index,
                title: card.querySelector('[data-testid="title"]')?.textContent?.trim()||'',
                address: card.querySelector('[data-testid="address"]')?.textContent?.trim()||'',
                price: card.querySelector('[data-testid="price-and-discounted-price"]')?.textContent?.trim()||'',
                text: (card.innerText||'').trim().slice(0,6000),
                links: [...card.querySelectorAll('a[href]')].map(a=>({text:(a.innerText||a.getAttribute('aria-label')||'').trim(),href:a.href})).slice(0,20)
              })),
              body: (document.body.innerText||'').slice(0,30000)
            })`, 300000);
            evidence.steps.follow = await js(`(()=>{
              const cards=[...document.querySelectorAll('[data-testid="property-card"]')];
              const card=cards.find(c=>/水芳瑞芳-九份|Sweetfun/i.test(c.innerText||''));
              if(!card)return 'sweetfun-card-not-found:'+cards.length;
              const links=[...card.querySelectorAll('a[href]')];
              const link=links.find(a=>/\/hotel\/tw\/shui-fang-sweetfun-rui-fang-jiu-fen/i.test(a.href))||links[0];
              if(!link)return 'sweetfun-link-not-found';
              const href=link.href; location.href=href; return href;
            })()`);
            await cmd(['wait', '--load', 'networkidle']);
            await cmd(['wait', '8000']);
            evidence.steps.property = await js(`JSON.stringify({
              url:location.href,
              title:document.title,
              dateButtons:[...document.querySelectorAll('button')].map(b=>(b.innerText||b.getAttribute('aria-label')||'').trim()).filter(t=>/9 月|入住日|退房日/.test(t)).slice(0,12),
              currency:[...document.querySelectorAll('button')].map(b=>(b.getAttribute('aria-label')||b.innerText||'').trim()).filter(t=>/價格為|TWD|新臺幣|USD/.test(t)).slice(0,12),
              propertyName:document.querySelector('h2')?.innerText?.trim()||'',
              address:[...document.querySelectorAll('button,a')].map(e=>(e.innerText||'').trim()).find(t=>/中山路24/.test(t))||'',
              table:document.querySelector('#hprt-table')?.innerText?.slice(0,50000)||'',
              rows:[...document.querySelectorAll('#hprt-table tr')].slice(0,120).map((tr,i)=>({i,text:(tr.innerText||'').trim().slice(0,6000),html:tr.outerHTML.slice(0,16000)})),
              body:(document.body.innerText||'').slice(0,50000)
            })`, 400000);
            await cmd(['close']);
          } finally { await sandbox.stop(); }
          await writeFile('ota-probe.json', JSON.stringify(evidence, null, 2));
          const concise = {};
          for (const [key, value] of Object.entries(evidence.steps)) concise[key] = { exitCode: value.exitCode, stdout: value.stdout.slice(0,25000), stderr: value.stderr.slice(0,500) };
          console.log(JSON.stringify(concise, null, 2));
          JS
          node probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-sandbox-ota-probe
          path: /tmp/radar-ota-probe/ota-probe.json
          retention-days: 7
