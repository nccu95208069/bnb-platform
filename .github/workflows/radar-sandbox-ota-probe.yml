name: Radar Sandbox OTA Probe

on:
  push:
    branches: [feat/competitor-radar-testable-preview]
    paths: [.github/workflows/radar-sandbox-ota-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TEAM_ID: team_rtARGegsahiZ6hOY7l2dUWGw
      VERCEL_PROJECT_ID: prj_5a6ilBSvneWYIDTGoCFFZhAjWYeM
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install probe SDK
        run: |
          mkdir -p /tmp/radar-ota-probe
          cd /tmp/radar-ota-probe
          npm init -y >/dev/null
          npm install --save-exact @vercel/sandbox >/dev/null
      - name: Select dates and inspect Booking room table
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: /tmp/radar-ota-probe
        run: |
          cat > probe.mjs <<'JS'
          import { Sandbox } from '@vercel/sandbox';
          import { writeFile } from 'node:fs/promises';
          const creds = { token: process.env.VERCEL_TOKEN, teamId: process.env.VERCEL_TEAM_ID, projectId: process.env.VERCEL_PROJECT_ID };
          const deps = ['nss','nspr','libxkbcommon','atk','at-spi2-atk','at-spi2-core','libXcomposite','libXdamage','libXrandr','libXfixes','libXcursor','libXi','libXtst','libXScrnSaver','libXext','mesa-libgbm','libdrm','mesa-libGL','mesa-libEGL','cups-libs','alsa-lib','pango','cairo','gtk3','dbus-libs'];
          const sandbox = await Sandbox.create({ ...creds, runtime: 'node24', timeout: 12 * 60 * 1000, resources: { vcpus: 2 }, networkPolicy: 'allow-all' });
          const evidence = { createdAt: new Date().toISOString(), steps: {} };
          async function cmd(args, limit = 120000) {
            const c = await sandbox.runCommand({ cmd: 'agent-browser', args });
            return { exitCode: c.exitCode, stdout: (await c.stdout()).slice(0, limit), stderr: (await c.stderr()).slice(0, 5000) };
          }
          async function evalJs(source) { return cmd(['eval', source]); }
          async function clickDate(date) {
            return evalJs(`(()=>{const e=[...document.querySelectorAll('[data-date="${date}"]')].find(x=>!x.closest('[aria-disabled="true"]')&&!x.hasAttribute('disabled'));if(!e)return 'missing:${date}';(e.closest('button')||e).click();return 'clicked:${date}'})()`);
          }
          try {
            let c = await sandbox.runCommand({ cmd: 'sh', args: ['-lc', `sudo dnf clean all >/dev/null 2>&1; sudo dnf install -y --skip-broken ${deps.join(' ')} >/tmp/dnf.log 2>&1; sudo ldconfig`] });
            if (c.exitCode) throw new Error(await c.stderr());
            c = await sandbox.runCommand({ cmd: 'npm', args: ['install', '-g', 'agent-browser@0.36.0'] });
            if (c.exitCode) throw new Error(await c.stderr());
            c = await sandbox.runCommand({ cmd: 'npx', args: ['agent-browser', 'install'] });
            if (c.exitCode) throw new Error(await c.stderr());

            evidence.steps.open = await cmd(['open', 'https://www.booking.com/hotel/tw/shui-fang-sweetfun-rui-fang-jiu-fen.zh-tw.html']);
            await cmd(['wait', '10000']);
            evidence.steps.harStart = await cmd(['network', 'har', 'start']);
            evidence.steps.openPicker = await evalJs(`(()=>{const b=[...document.querySelectorAll('button')].find(x=>/選擇日期|入住日/.test((x.innerText||'')+(x.getAttribute('aria-label')||'')));if(!b)return 'date-button-not-found';b.click();return 'opened'})()`);
            await cmd(['wait', '500']);
            evidence.steps.checkin = await clickDate('2026-09-28');
            await cmd(['wait', '750']);
            evidence.steps.checkout = await clickDate('2026-09-29');
            await cmd(['wait', '1000']);
            evidence.steps.selected = await evalJs(`JSON.stringify({dateButtons:[...document.querySelectorAll('button')].map(b=>(b.innerText||'').trim()).filter(t=>/9 月|入住日|退房日/.test(t)).slice(0,8),hidden:[...document.querySelectorAll('input')].map(i=>({name:i.name,value:i.value})).filter(x=>/checkin|checkout/.test(x.name||''))})`);
            evidence.steps.search = await evalJs(`(()=>{const b=[...document.querySelectorAll('button')].filter(x=>(x.innerText||'').trim()==='搜尋')[0];if(!b)return 'search-not-found';b.click();return 'clicked-top-search'})()`);
            await cmd(['wait', '--load', 'networkidle']);
            await cmd(['wait', '10000']);
            evidence.steps.final = await evalJs(`JSON.stringify({url:location.href,title:document.title,dates:[...document.querySelectorAll('button')].map(b=>(b.innerText||'').trim()).filter(t=>/9 月|入住日|退房日/.test(t)).slice(0,8),body:(document.body.innerText||'').slice(0,35000),table:document.querySelector('#hprt-table')?.innerText?.slice(0,35000)||'',rows:[...document.querySelectorAll('#hprt-table tr')].slice(0,80).map((tr,i)=>({i,text:(tr.innerText||'').trim().slice(0,4000),html:tr.outerHTML.slice(0,12000)}))})`);
            evidence.steps.harStop = await cmd(['network', 'har', 'stop', '/tmp/booking.har']);
            const har = await sandbox.runCommand({ cmd: 'node', args: ['-e', `const h=require('/tmp/booking.har');const es=h.log.entries.filter(e=>/json/i.test(e.response.content.mimeType||'')||/avail|room|hotel|search|block/i.test(e.request.url)).map(e=>({method:e.request.method,status:e.response.status,url:e.request.url,mime:e.response.content.mimeType,size:e.response.content.size,text:(e.response.content.text||'').slice(0,4000)}));console.log(JSON.stringify(es.slice(-120)))`] });
            evidence.steps.har = { exitCode: har.exitCode, stdout: (await har.stdout()).slice(0,120000), stderr: (await har.stderr()).slice(0,5000) };
            await cmd(['close']);
          } finally { await sandbox.stop(); }
          await writeFile('ota-probe.json', JSON.stringify(evidence, null, 2));
          const concise = {};
          for (const [key, value] of Object.entries(evidence.steps)) concise[key] = { exitCode: value.exitCode, stdout: value.stdout.slice(0,5000), stderr: value.stderr.slice(0,500) };
          console.log(JSON.stringify(concise, null, 2));
          JS
          node probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-sandbox-ota-probe
          path: /tmp/radar-ota-probe/ota-probe.json
          retention-days: 7
