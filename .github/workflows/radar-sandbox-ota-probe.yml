name: Radar Sandbox OTA Probe

on:
  push:
    branches: [feat/competitor-radar-testable-preview]
    paths: [.github/workflows/radar-sandbox-ota-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TEAM_ID: team_rtARGegsahiZ6hOY7l2dUWGw
      VERCEL_PROJECT_ID: prj_5a6ilBSvneWYIDTGoCFFZhAjWYeM
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install probe SDK
        run: |
          mkdir -p /tmp/radar-ota-probe
          cd /tmp/radar-ota-probe
          npm init -y >/dev/null
          npm install --save-exact @vercel/sandbox agent-browser@0.36.0 >/dev/null

      - name: Run isolated browser probes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: /tmp/radar-ota-probe
        run: |
          cat > probe.mjs <<'JS'
          import { Sandbox } from '@vercel/sandbox';
          import { writeFile } from 'node:fs/promises';

          const credentials = {
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_TEAM_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
          };
          if (!credentials.token) throw new Error('VERCEL_TOKEN is not configured');

          const targets = [
            {
              platform: 'booking',
              url: 'https://www.booking.com/hotel/tw/shui-fang-sweetfun-rui-fang-jiu-fen.zh-tw.html?checkin=2026-09-28&checkout=2026-09-29&group_adults=2&group_children=0&no_rooms=1&selected_currency=TWD',
            },
            {
              platform: 'agoda',
              url: 'https://www.agoda.com/sweetfun/hotel/taipei-tw.html?checkIn=2026-09-28&los=1&rooms=1&adults=2&children=0&currencyCode=TWD',
            },
            {
              platform: 'trip',
              url: 'https://tw.trip.com/hotels/new-taipei-city-hotel-detail-133359377/sweet-fun/?checkIn=2026-09-28&checkOut=2026-09-29&adult=2&children=0&crn=1&curr=TWD',
            },
          ];

          const deps = [
            'nss','nspr','libxkbcommon','atk','at-spi2-atk','at-spi2-core',
            'libXcomposite','libXdamage','libXrandr','libXfixes','libXcursor',
            'libXi','libXtst','libXScrnSaver','libXext','mesa-libgbm','libdrm',
            'mesa-libGL','mesa-libEGL','cups-libs','alsa-lib','pango','cairo','gtk3','dbus-libs',
          ];

          const sandbox = await Sandbox.create({
            ...credentials,
            runtime: 'node24',
            timeout: 12 * 60 * 1000,
            resources: { vcpus: 2 },
            networkPolicy: 'allow-all',
          });
          const result = { sandboxId: sandbox.sandboxId, createdAt: new Date().toISOString(), targets: [] };
          try {
            let command = await sandbox.runCommand({ cmd: 'sh', args: ['-lc', `sudo dnf clean all >/dev/null 2>&1; sudo dnf install -y --skip-broken ${deps.join(' ')} >/tmp/dnf.log 2>&1; sudo ldconfig` ] });
            if (command.exitCode !== 0) throw new Error(`system deps failed: ${await command.stderr()}`);
            command = await sandbox.runCommand({ cmd: 'npm', args: ['install', '-g', 'agent-browser@0.36.0'] });
            if (command.exitCode !== 0) throw new Error(`agent-browser install failed: ${await command.stderr()}`);
            command = await sandbox.runCommand({ cmd: 'npx', args: ['agent-browser', 'install'] });
            if (command.exitCode !== 0) throw new Error(`browser install failed: ${await command.stderr()}`);

            for (const target of targets) {
              const evidence = { platform: target.platform, requestedUrl: target.url };
              try {
                await sandbox.runCommand({ cmd: 'agent-browser', args: ['close'] });
                const opened = await sandbox.runCommand({ cmd: 'agent-browser', args: ['open', target.url] });
                evidence.openExit = opened.exitCode;
                evidence.openStderr = (await opened.stderr()).slice(0, 2000);
                await sandbox.runCommand({ cmd: 'agent-browser', args: ['wait', '15000'] });
                const finalUrl = await sandbox.runCommand({ cmd: 'agent-browser', args: ['get', 'url'] });
                const title = await sandbox.runCommand({ cmd: 'agent-browser', args: ['get', 'title'] });
                const body = await sandbox.runCommand({ cmd: 'agent-browser', args: ['get', 'text', 'body'] });
                const snapshot = await sandbox.runCommand({ cmd: 'agent-browser', args: ['snapshot', '-i', '-c'] });
                const bodyText = (await body.stdout()).slice(0, 60000);
                const snapText = (await snapshot.stdout()).slice(0, 60000);
                evidence.finalUrl = (await finalUrl.stdout()).trim();
                evidence.title = (await title.stdout()).trim();
                evidence.bodyLength = bodyText.length;
                evidence.bodyExcerpt = bodyText;
                evidence.snapshotExcerpt = snapText;
                evidence.flags = {
                  challenge: /captcha|robot|verify you are human|request rejected|安全性因素|機器人|驗證您/i.test(`${evidence.title}\n${bodyText}`),
                  sweetfun: /水芳|Sweetfun|Sweet fun/i.test(`${evidence.title}\n${bodyText}`),
                  requestedDate: /2026[-年/. ]*09[-月/. ]*28|9月28|Sep(?:tember)?\s+28/i.test(bodyText),
                  hasTwd: /TWD|NT\$|NTD|新台幣/i.test(bodyText),
                  hasRoomLanguage: /房型|客房|房間|room|bed/i.test(bodyText),
                };
              } catch (error) {
                evidence.error = error instanceof Error ? error.message : String(error);
              }
              result.targets.push(evidence);
            }
            await sandbox.runCommand({ cmd: 'agent-browser', args: ['close'] });
          } finally {
            await sandbox.stop();
          }

          await writeFile('ota-probe.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result.targets.map(({ platform, finalUrl, title, bodyLength, flags, error }) => ({ platform, finalUrl, title, bodyLength, flags, error })), null, 2));
          JS

          node probe.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-sandbox-ota-probe
          path: /tmp/radar-ota-probe/ota-probe.json
          retention-days: 7
