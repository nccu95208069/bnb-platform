name: Competitor Registry Smoke

on:
  push:
    branches: [feat/competitor-radar-registry-discovery]

permissions:
  contents: read

jobs:
  live-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project dependencies
        run: npm ci

      - name: Install ephemeral TypeScript runner
        run: npm install --no-save --ignore-scripts tsx@4

      - name: Match Sweetfun through the production registry adapter
        shell: bash
        run: |
          cat > registry-smoke.ts <<'TS'
          import { findTourismRegistryCandidates } from "./src/lib/competitor-radar/taiwan-tourism-registry";

          async function main() {
            const expectedHotelId = "Hotel_A15010000H_035813";
            const candidates = await findTourismRegistryCandidates({
              name: "水芳 Sweetfun",
              address: "新北市瑞芳區東和里中山路24-1號",
              phone: "0973400562",
              websiteUrl: "https://www.sweetfuntw.com/",
            });

            console.log(
              JSON.stringify(
                candidates.map((candidate) => ({
                  hotelId: candidate.record.hotelId,
                  registrationNumber: candidate.record.registrationNumber,
                  name: candidate.record.name,
                  address: candidate.record.address,
                  phone: candidate.record.phone,
                  totalRooms: candidate.record.totalRooms,
                  status: candidate.match.status,
                  score: candidate.match.score,
                  conflicts: candidate.match.conflicts,
                  platformUrls: candidate.platformUrls,
                })),
                null,
                2,
              ),
            );

            const sweetfun = candidates.find(
              (candidate) => candidate.record.hotelId === expectedHotelId,
            );
            if (!sweetfun) throw new Error(`Missing expected record ${expectedHotelId}`);
            if (sweetfun.match.status !== "confirmed") {
              throw new Error(`Expected confirmed match, got ${sweetfun.match.status}`);
            }
            if (sweetfun.record.registrationNumber !== "新北市民宿402號") {
              throw new Error(
                `Unexpected license: ${sweetfun.record.registrationNumber ?? "missing"}`,
              );
            }
            if (sweetfun.record.phone?.replace(/\D/g, "") !== "0973400562") {
              throw new Error(`Unexpected phone: ${sweetfun.record.phone ?? "missing"}`);
            }
            if (!sweetfun.record.address?.includes("中山路24之1號")) {
              throw new Error(`Unexpected address: ${sweetfun.record.address ?? "missing"}`);
            }
            if (sweetfun.match.conflicts.length) {
              throw new Error(`Unexpected conflicts: ${sweetfun.match.conflicts.join("; ")}`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          TS

          npx tsx registry-smoke.ts
          rm registry-smoke.ts
