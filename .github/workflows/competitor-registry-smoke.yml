name: Competitor Registry Smoke

on:
  push:
    branches: [feat/competitor-radar-registry-discovery]

permissions:
  contents: read

jobs:
  live-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project dependencies
        run: npm ci

      - name: Install ephemeral TypeScript runner
        run: npm install --no-save --ignore-scripts tsx@4

      - name: Fetch the official registry through the production adapter
        shell: bash
        run: |
          cat > /tmp/registry-smoke.ts <<'TS'
          import { findTourismRegistryCandidates } from "./src/lib/competitor-radar/taiwan-tourism-registry";

          const archiveUrl = "https://media.taiwan.net.tw/XMLReleaseAll_public/v2.0/Zh_tw/Hotel-json.zip";

          async function logTransport() {
            const response = await fetch(archiveUrl, {
              headers: { Accept: "application/zip,application/octet-stream" },
              redirect: "manual",
            });
            const bytes = Buffer.from(await response.arrayBuffer());
            console.log(JSON.stringify({
              status: response.status,
              url: response.url,
              contentType: response.headers.get("content-type"),
              contentEncoding: response.headers.get("content-encoding"),
              contentLength: response.headers.get("content-length"),
              location: response.headers.get("location"),
              byteLength: bytes.length,
              first32Hex: bytes.subarray(0, 32).toString("hex"),
              first160Text: bytes.subarray(0, 160).toString("utf8"),
              last32Hex: bytes.subarray(Math.max(0, bytes.length - 32)).toString("hex"),
            }, null, 2));
          }

          async function main() {
            await logTransport();

            const expectedHotelId = "Hotel_A15010000H_035813";
            const candidates = await findTourismRegistryCandidates({
              name: "水芳 Sweetfun",
              address: "新北市瑞芳區東和里中山路24-1號",
              phone: "0973400562",
              websiteUrl: "https://www.sweetfuntw.com/",
            });

            const summary = candidates.map((candidate) => ({
              hotelId: candidate.record.hotelId,
              name: candidate.record.name,
              address: candidate.record.address,
              status: candidate.match.status,
              score: candidate.match.score,
              conflicts: candidate.match.conflicts,
            }));
            console.log(JSON.stringify(summary, null, 2));

            const sweetfun = candidates.find(
              (candidate) => candidate.record.hotelId === expectedHotelId,
            );
            if (!sweetfun) {
              throw new Error(`Missing expected government record ${expectedHotelId}`);
            }
            if (sweetfun.match.status !== "confirmed") {
              throw new Error(`Expected confirmed match, got ${sweetfun.match.status}`);
            }
            if (sweetfun.match.conflicts.length) {
              throw new Error(`Unexpected conflicts: ${sweetfun.match.conflicts.join("; ")}`);
            }
            if (!sweetfun.record.address?.includes("中山路24")) {
              throw new Error(`Unexpected address: ${sweetfun.record.address ?? "missing"}`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          TS

          cp /tmp/registry-smoke.ts ./registry-smoke.ts
          npx tsx registry-smoke.ts
          rm registry-smoke.ts
