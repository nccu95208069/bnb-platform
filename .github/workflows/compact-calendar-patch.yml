name: Apply compact mobile calendar patch

on:
  push:
    branches: [fix/compact-mobile-calendar]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[compact-mobile-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-mobile-calendar
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("frontend/src/components/calendar/booking-calendar-responsive.tsx")
          text = path.read_text()

          old = (
              '  const mobileSearchOpen = useCalendarPreferences((state) => state.mobileSearchOpen);\n'
              '  const setMobileSearchOpen = useCalendarPreferences((state) => state.setMobileSearchOpen);\n'
              '  const selectedPropertyIds = useCalendarPreferences((state) => state.selectedPropertyIds);\n'
              '  const setProperties = useCalendarPreferences((state) => state.setProperties);\n'
          )
          new = (
              '  const mobileSearchOpen = useCalendarPreferences((state) => state.mobileSearchOpen);\n'
              '  const setMobileSearchOpen = useCalendarPreferences((state) => state.setMobileSearchOpen);\n'
              '  const setMobilePeriodLabel = useCalendarPreferences(\n'
              '    (state) => state.setMobilePeriodLabel,\n'
              '  );\n'
              '  const navigationRequest = useCalendarPreferences(\n'
              '    (state) => state.navigationRequest,\n'
              '  );\n'
              '  const selectedPropertyIds = useCalendarPreferences((state) => state.selectedPropertyIds);\n'
              '  const setProperties = useCalendarPreferences((state) => state.setProperties);\n'
          )
          if old not in text:
              raise SystemExit("preference hook block not found")
          text = text.replace(old, new, 1)

          old = (
              '  const hasLoadedData = useRef(false);\n'
              '  const previousView = useRef<CalendarView>(view);\n'
          )
          new = (
              '  const hasLoadedData = useRef(false);\n'
              '  const previousView = useRef<CalendarView>(view);\n'
              '  const handledNavigationRequest = useRef(0);\n'
          )
          if old not in text:
              raise SystemExit("ref block not found")
          text = text.replace(old, new, 1)

          marker = (
              '  useEffect(() => {\n'
              '    const oldView = previousView.current;\n'
          )
          insertion = (
              '  useEffect(() => {\n'
              '    setMobilePeriodLabel(displayPeriod.label);\n'
              '  }, [displayPeriod.label, setMobilePeriodLabel]);\n\n'
              '  useEffect(() => {\n'
              '    if (!navigationRequest) return;\n'
              '    if (navigationRequest.id <= handledNavigationRequest.current) return;\n'
              '    handledNavigationRequest.current = navigationRequest.id;\n\n'
              '    if (navigationRequest.action === "today") {\n'
              '      const today = localTodayIso();\n'
              '      setAnchorDate(today);\n'
              '      if (view === "month") {\n'
              '        const month = startOfMonth(today);\n'
              '        setVisibleMonth(month);\n'
              '        setMonthTarget(month);\n'
              '      }\n'
              '      return;\n'
              '    }\n\n'
              '    const direction = navigationRequest.action === "previous" ? -1 : 1;\n'
              '    if (view === "month") {\n'
              '      const target = addMonths(visibleMonth, direction);\n'
              '      setVisibleMonth(target);\n'
              '      setMonthTarget(target);\n'
              '      setAnchorDate(target);\n'
              '      return;\n'
              '    }\n'
              '    if (view === "week") {\n'
              '      setAnchorDate((value) => addDays(value, direction * 7));\n'
              '      return;\n'
              '    }\n'
              '    setAnchorDate((value) => addDays(value, direction));\n'
              '  }, [navigationRequest, view, visibleMonth]);\n\n'
              '  useEffect(() => {\n'
              '    const oldView = previousView.current;\n'
          )
          if marker not in text:
              raise SystemExit("effect insertion marker not found")
          text = text.replace(marker, insertion, 1)

          toolbar_pattern = re.compile(
              r'\n      <section className="sticky top-14 z-30 -mx-2 border-b bg-background/95 backdrop-blur md:hidden">.*?\n      </section>\n',
              re.DOTALL,
          )
          text, count = toolbar_pattern.subn("\n", text, count=1)
          if count != 1:
              raise SystemExit("mobile date toolbar not found")

          path.write_text(text)

          css = Path("frontend/src/app/globals.css")
          css_text = css.read_text()
          old_css = "height: calc(100dvh - 6.5rem) !important;"
          new_css = "height: calc(100dvh - 3.5rem) !important;"
          if old_css not in css_text:
              raise SystemExit("mobile calendar height rule not found")
          css.write_text(css_text.replace(old_css, new_css, 1))
          PY

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: |
          npm run lint
          npm run build

      - name: Commit patch
        run: |
          git config user.name "Sweetfun CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/calendar/booking-calendar-responsive.tsx frontend/src/app/globals.css
          git commit -m "fix: compact mobile calendar chrome [compact-mobile-applied]"
          git push origin HEAD:fix/compact-mobile-calendar
