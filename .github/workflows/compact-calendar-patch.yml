name: Apply compact mobile calendar patch

on:
  push:
    branches: [fix/compact-mobile-calendar]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[compact-mobile-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-mobile-calendar
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply source patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("frontend/src/components/calendar/booking-calendar-responsive.tsx")
          text = path.read_text()

          old = '''  const mobileSearchOpen = useCalendarPreferences((state) => state.mobileSearchOpen);
          const setMobileSearchOpen = useCalendarPreferences((state) => state.setMobileSearchOpen);
          const selectedPropertyIds = useCalendarPreferences((state) => state.selectedPropertyIds);
          const setProperties = useCalendarPreferences((state) => state.setProperties);
          '''
          new = '''  const mobileSearchOpen = useCalendarPreferences((state) => state.mobileSearchOpen);
          const setMobileSearchOpen = useCalendarPreferences((state) => state.setMobileSearchOpen);
          const setMobilePeriodLabel = useCalendarPreferences(
            (state) => state.setMobilePeriodLabel,
          );
          const navigationRequest = useCalendarPreferences(
            (state) => state.navigationRequest,
          );
          const selectedPropertyIds = useCalendarPreferences((state) => state.selectedPropertyIds);
          const setProperties = useCalendarPreferences((state) => state.setProperties);
          '''
          if old not in text:
              raise SystemExit("preference hook block not found")
          text = text.replace(old, new, 1)

          old = '''  const hasLoadedData = useRef(false);
          const previousView = useRef<CalendarView>(view);
          '''
          new = '''  const hasLoadedData = useRef(false);
          const previousView = useRef<CalendarView>(view);
          const handledNavigationRequest = useRef(0);
          '''
          if old not in text:
              raise SystemExit("ref block not found")
          text = text.replace(old, new, 1)

          marker = '''  useEffect(() => {
            const oldView = previousView.current;
          '''
          insertion = '''  useEffect(() => {
            setMobilePeriodLabel(displayPeriod.label);
          }, [displayPeriod.label, setMobilePeriodLabel]);

          useEffect(() => {
            if (!navigationRequest) return;
            if (navigationRequest.id <= handledNavigationRequest.current) return;
            handledNavigationRequest.current = navigationRequest.id;

            if (navigationRequest.action === "today") {
              const today = localTodayIso();
              setAnchorDate(today);
              if (view === "month") {
                const month = startOfMonth(today);
                setVisibleMonth(month);
                setMonthTarget(month);
              }
              return;
            }

            const direction = navigationRequest.action === "previous" ? -1 : 1;
            if (view === "month") {
              const target = addMonths(visibleMonth, direction);
              setVisibleMonth(target);
              setMonthTarget(target);
              setAnchorDate(target);
              return;
            }
            if (view === "week") {
              setAnchorDate((value) => addDays(value, direction * 7));
              return;
            }
            setAnchorDate((value) => addDays(value, direction));
          }, [navigationRequest, view, visibleMonth]);

          useEffect(() => {
            const oldView = previousView.current;
          '''
          if marker not in text:
              raise SystemExit("effect insertion marker not found")
          text = text.replace(marker, insertion, 1)

          old = '''      <section className="sticky top-14 z-30 -mx-2 border-b bg-background/95 backdrop-blur md:hidden">
            <div className="flex h-12 items-center gap-1 px-1.5">
              <Button
                variant="ghost"
                size="icon"
                onClick={() => navigate(-1)}
                aria-label="上一個區間"
              >
                <ChevronLeft className="size-5" />
              </Button>
              <Button variant="ghost" size="sm" onClick={goToToday}>
                今天
              </Button>
              <div className="min-w-0 flex-1 truncate px-1 text-center text-sm font-semibold">
                {displayPeriod.label}
              </div>
              {refreshing && (
                <LoaderCircle className="size-4 shrink-0 animate-spin text-muted-foreground" />
              )}
              <Button
                variant="ghost"
                size="icon"
                onClick={() => navigate(1)}
                aria-label="下一個區間"
              >
                <ChevronRight className="size-5" />
              </Button>
            </div>
          </section>

          '''
          if old not in text:
              raise SystemExit("mobile date toolbar not found")
          text = text.replace(old, "", 1)

          path.write_text(text)

          css = Path("frontend/src/app/globals.css")
          css_text = css.read_text()
          old_css = "height: calc(100dvh - 6.5rem) !important;"
          new_css = "height: calc(100dvh - 3.5rem) !important;"
          if old_css not in css_text:
              raise SystemExit("mobile calendar height rule not found")
          css.write_text(css_text.replace(old_css, new_css, 1))
          PY

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Validate frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_DEMO_MODE: "true"
        run: |
          npm run lint
          npm run build

      - name: Commit patch
        run: |
          git config user.name "Sweetfun CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src/components/calendar/booking-calendar-responsive.tsx frontend/src/app/globals.css
          git commit -m "fix: compact mobile calendar chrome [compact-mobile-applied]"
          git push origin HEAD:fix/compact-mobile-calendar
