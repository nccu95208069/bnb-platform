name: Radar Add Sandbox Dependency

on:
  push:
    branches: [feat/competitor-radar-testable-preview]
    paths: [.github/workflows/radar-add-sandbox-dependency.yml]

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/competitor-radar-testable-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Add exact server dependency
        working-directory: frontend
        run: npm install --save-exact @vercel/sandbox
      - name: Commit only package metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/package.json frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'build: add Vercel Sandbox runtime'
          git push origin HEAD:feat/competitor-radar-testable-preview
