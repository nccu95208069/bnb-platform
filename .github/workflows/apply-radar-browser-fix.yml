name: Apply Radar Browser Acceptance Fix

on:
  push:
    branches: [feat/competitor-radar-testable-preview]
    paths: [.github/workflows/apply-radar-browser-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/competitor-radar-testable-preview
          fetch-depth: 0
      - name: Fix explicit TWD display and browser fixture
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('frontend/src/components/competitor-radar/radar-dashboard.tsx')
          text = dashboard.read_text()
          old = '''function formatMoney(amount: number, currency = "TWD"): string {
            try {
              return new Intl.NumberFormat("zh-TW", {
                style: "currency",
                currency,
                maximumFractionDigits: currency === "TWD" ? 0 : 2,
              }).format(amount);
            } catch {
              return `${currency} ${amount.toLocaleString("en-US")}`;
            }
          }
          '''
          new = '''function formatMoney(amount: number, currency = "TWD"): string {
            if (currency === "TWD") {
              return `NT$${new Intl.NumberFormat("zh-TW", {
                maximumFractionDigits: 0,
              }).format(amount)}`;
            }
            try {
              return new Intl.NumberFormat("zh-TW", {
                style: "currency",
                currency,
                currencyDisplay: "code",
                maximumFractionDigits: 2,
              }).format(amount);
            } catch {
              return `${currency} ${amount.toLocaleString("en-US")}`;
            }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one formatMoney block')
          dashboard.write_text(text.replace(old, new))

          browser = Path('frontend/tests/radar-preview-browser.cjs')
          text = browser.read_text()
          old = 'const sold = (index + roomIndex) % 4 === 0;'
          new = 'const sold = (index + roomIndex) % 4 === 3;'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one sold-out fixture expression')
          browser.write_text(text.replace(old, new))
          PY
          git add frontend/src/components/competitor-radar/radar-dashboard.tsx frontend/tests/radar-preview-browser.cjs
          git diff --cached --check
          grep -F 'return `NT$${new Intl.NumberFormat' frontend/src/components/competitor-radar/radar-dashboard.tsx
          grep -F 'const sold = (index + roomIndex) % 4 === 3;' frontend/tests/radar-preview-browser.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make radar browser price fixture observable'
          git push origin HEAD:feat/competitor-radar-testable-preview
