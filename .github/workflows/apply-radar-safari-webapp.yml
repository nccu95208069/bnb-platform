name: Apply Radar Safari Web App

on:
  push:
    branches: [feat/competitor-radar-testable-preview]
    paths: [.github/workflows/apply-radar-safari-webapp.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/competitor-radar-testable-preview
          fetch-depth: 0
      - name: Reconstruct reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { writeFile } from 'node:fs/promises';
          const shas = [
            'f26e7398520fd76b3b69bb1d707014698dd82613',
            '165131580561ebd0e4f8e3386edb50dbfcf8b60a',
            'c5786b8ec5ce7545fe3e43476cd76138dcecd341',
            '659dc7fe68a60dba990916a5e7f7e4c025e58a4e',
          ];
          const chunks = [];
          for (const sha of shas) {
            const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs/${sha}`, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
            });
            if (!response.ok) throw new Error(`Unable to fetch patch blob ${sha}: ${response.status}`);
            const payload = await response.json();
            chunks.push(Buffer.from(payload.content.replace(/\n/g, ''), 'base64').toString('utf8'));
          }
          await writeFile('/tmp/radar-safari.patch.gz.b64', chunks.join(''));
          JS
          base64 --decode /tmp/radar-safari.patch.gz.b64 | gzip --decompress > /tmp/radar-safari.patch
          echo '4a6c1eacb047b181922ec42fdf3306325d9be188dd47daf837b07f6ac116d774  /tmp/radar-safari.patch' | sha256sum --check --strict
          git apply --check /tmp/radar-safari.patch
      - name: Apply and commit application code
        run: |
          git apply /tmp/radar-safari.patch
          git restore --source=HEAD -- .github/workflows/radar-preview-check.yml .github/workflows/radar-preview-deploy.yml
          git add frontend scripts
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^.github/workflows/' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: deliver Safari competitor radar web app'
          git push origin HEAD:feat/competitor-radar-testable-preview
