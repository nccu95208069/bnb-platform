name: Radar Sandbox Trip Room Probe

on:
  push:
    branches: [feat/competitor-radar-testable-preview]
    paths: [.github/workflows/radar-sandbox-trip-room-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      VERCEL_TEAM_ID: team_rtARGegsahiZ6hOY7l2dUWGw
      VERCEL_PROJECT_ID: prj_5a6ilBSvneWYIDTGoCFFZhAjWYeM
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          mkdir -p /tmp/radar-trip-room && cd /tmp/radar-trip-room
          npm init -y >/dev/null
          npm install --save-exact @vercel/sandbox >/dev/null
      - name: Expand and inspect room list
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: /tmp/radar-trip-room
        run: |
          cat > probe.mjs <<'JS'
          import { Sandbox } from '@vercel/sandbox';
          import { writeFile } from 'node:fs/promises';
          const sandbox = await Sandbox.create({
            token: process.env.VERCEL_TOKEN,
            teamId: process.env.VERCEL_TEAM_ID,
            projectId: process.env.VERCEL_PROJECT_ID,
            source: { type:'snapshot', snapshotId:'snap_c3rDmQdTPMoDHIu55bxS3MruQxZz' },
            timeout: 5 * 60 * 1000,
            resources:{vcpus:2}, networkPolicy:'allow-all'
          });
          const e={};
          async function c(args,limit=900000){const r=await sandbox.runCommand({cmd:'agent-browser',args});return{exitCode:r.exitCode,stdout:(await r.stdout()).slice(0,limit),stderr:(await r.stderr()).slice(0,5000)}}
          async function j(src,limit){return c(['eval',src],limit)}
          try{
            const url='https://tw.trip.com/hotels/new-taipei-city-hotel-detail-133359377/sweet-fun/?checkIn=2026-09-08&checkOut=2026-09-09&adult=2&children=0&crn=1&curr=TWD';
            e.open=await c(['open',url]); await c(['wait','--load','networkidle']); await c(['wait','6000']);
            e.clickables=await j(`JSON.stringify([...document.querySelectorAll('button,a,[role="button"],div')].map((x,i)=>({i,tag:x.tagName,text:(x.innerText||x.textContent||'').trim().slice(0,300),cls:String(x.className||''),role:x.getAttribute('role')})).filter(x=>/更多選項|選擇房型|選擇房間|查看空房|顯示更多/.test(x.text)).slice(0,80))`);
            e.click=await j(`(()=>{const x=[...document.querySelectorAll('button,a,[role="button"],div')].find(x=>/^(更多選項|選擇房型|查看空房情況)$/.test((x.innerText||x.textContent||'').trim()));if(!x)return 'not-found';(x.closest('button,a,[role="button"]')||x).click();return 'clicked:'+x.tagName+':'+String(x.className)})()`);
            await c(['wait','--load','networkidle']); await c(['wait','7000']);
            e.after=await j(`JSON.stringify({url:location.href,title:document.title,body:(document.body.innerText||'').slice(0,100000),priceNodes:[...document.querySelectorAll('[class*="price"],[data-testid*="price"],[data-element-name*="price"]')].map(x=>({tag:x.tagName,cls:String(x.className||''),text:(x.innerText||x.textContent||'').trim()})).filter(x=>x.text&&!/^\\d{1,2}$/.test(x.text)).slice(0,300),roomNodes:[...document.querySelectorAll('[class*="room"],[data-testid*="room"],[data-element-name*="room"]')].map(x=>({tag:x.tagName,cls:String(x.className||''),text:(x.innerText||x.textContent||'').trim().slice(0,12000)})).filter(x=>x.text).slice(0,200),scripts:[...document.scripts].map((s,i)=>({i,type:s.type||'',id:s.id||'',text:(s.textContent||'')})).filter(x=>/hotelRoomListRequest|roomList|roomName|salePrice|displayPrice|priceInfo/i.test(x.text)).slice(0,60)})`,900000);
            await c(['close']);
          }finally{await sandbox.stop()}
          await writeFile('trip-room.json',JSON.stringify(e,null,2));
          console.log(JSON.stringify(Object.fromEntries(Object.entries(e).map(([k,v])=>[k,{exitCode:v.exitCode,stdout:v.stdout.slice(0,80000),stderr:v.stderr.slice(0,500)}])),null,2));
          JS
          node probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-trip-room-probe
          path: /tmp/radar-trip-room/trip-room.json
          retention-days: 7
