name: Production release instructions

# The former push-to-main demo deployment could replace the live owner site.
# Keep this workflow harmless even if it is manually re-enabled in GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-instructions:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the reviewed release procedure
        run: |
          echo "Automatic production publishing is retired."
          echo "Follow docs/work-handoff/PRODUCTION_RELEASE_POLICY.md."
          echo "Merging a PR preserves the current production deployment."
