name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: sweetfuns-projects
      VERCEL_PROJECT: sweetfun-os
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Link dedicated Sweetfun OS project
        run: |
          unset VERCEL_PROJECT_ID VERCEL_ORG_ID
          vercel link \
            --yes \
            --project "$VERCEL_PROJECT" \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN"

      - name: Deploy anonymized calendar site
        shell: bash
        run: |
          deployment_url="$(vercel \
            --prod \
            --yes \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_DEMO_MODE=true \
            --env NEXT_PUBLIC_DEMO_MODE=true \
            --build-env NEXT_PUBLIC_SUPABASE_URL=https://demo-placeholder.supabase.co \
            --env NEXT_PUBLIC_SUPABASE_URL=https://demo-placeholder.supabase.co \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY=demo-placeholder-anon-key \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY=demo-placeholder-anon-key)"
          echo "Deployed: $deployment_url"
          {
            echo "### Sweetfun OS deployment"
            echo
            echo "$deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"

  # Backend deploys automatically via Railway GitHub native integration.
