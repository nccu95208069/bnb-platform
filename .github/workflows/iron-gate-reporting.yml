name: Iron Gate reporting verification
on:
  pull_request:
    branches: [codex/os-iron-gate-bridge-20261013]
    paths: ['iron-gate/**', '.github/workflows/iron-gate-reporting.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: iron-gate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: iron-gate/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
