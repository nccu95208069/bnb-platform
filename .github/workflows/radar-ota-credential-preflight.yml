name: Radar OTA Credential Preflight

on:
  push:
    branches: [feat/competitor-radar-testable-preview]
    paths: [.github/workflows/radar-ota-credential-preflight.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}
      BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
      BRIGHT_DATA_API_KEY: ${{ secrets.BRIGHT_DATA_API_KEY }}
      BRIGHT_DATA_BOOKING_DETAILS_DATASET_ID: ${{ secrets.BRIGHT_DATA_BOOKING_DETAILS_DATASET_ID }}
      BRIGHT_DATA_BOOKING_DATASET_ID: ${{ secrets.BRIGHT_DATA_BOOKING_DATASET_ID }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Report presence only
        run: |
          node <<'JS'
          const names = [
            'BRIGHT_DATA_API_TOKEN',
            'BRIGHTDATA_API_TOKEN',
            'BRIGHT_DATA_API_KEY',
            'BRIGHT_DATA_BOOKING_DETAILS_DATASET_ID',
            'BRIGHT_DATA_BOOKING_DATASET_ID',
            'APIFY_TOKEN',
            'VERCEL_TOKEN',
          ];
          console.log(JSON.stringify(Object.fromEntries(names.map(name => [name, Boolean(process.env[name])])), null, 2));
          JS
