name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/sweetfun-bots]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      payment-postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bnb_payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PAYMENT_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/bnb_payment_test
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Run tests
        run: pytest --tb=short -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript + Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  customer-workspaces:
    name: Customer workspace isolation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tenant, booking, session and legacy authorization regressions
        run: node --experimental-strip-types --loader ./tests/helpers/next-route-loader.mjs --test tests/customer-order-finder.test.mjs tests/customer-order-finder-routes.test.mjs tests/customer-workspaces.test.mjs tests/customer-operations.test.mjs tests/customer-operations-routes.test.mjs tests/customer-onboarding.test.mjs tests/customer-onboarding-routes.test.mjs tests/customer-sheet-import.test.mjs tests/customer-intake.test.mjs tests/customer-intake-routes.test.mjs tests/customer-intake-mail.test.mjs tests/customer-workspace-routes.test.mjs tests/workspace-auth.test.mjs tests/workspace-auth-routes.test.mjs tests/calendar-owner-session.test.mjs tests/customer-standard-sheet.test.mjs tests/customer-calendar-source.test.mjs tests/customer-calendar-import.test.mjs tests/customer-calendar-google.test.mjs tests/customer-calendar-routes.test.mjs tests/customer-sheet-normalizer.test.mjs tests/customer-calendar-onboarding.test.mjs tests/customer-google-signin.test.mjs tests/customer-passwordless.test.mjs tests/customer-calendar-onboarding-routes.test.mjs
      - name: Calendar conflict recovery and import wizard DOM regressions
        run: node --loader ./tests/helpers/customer-component-loader.mjs --test tests/customer-order-finder-ui.test.mjs tests/customer-calendar.test.mjs tests/customer-operations-ui.test.mjs tests/customer-sheet-import-ui.test.mjs tests/customer-intake-ui.test.mjs tests/customer-onboarding-ui.test.mjs tests/customer-calendar-import-ui.test.mjs tests/customer-standard-sheet-ui.test.mjs tests/customer-passwordless-ui.test.mjs
