name: Apply Radar Mobile Tab Selector Fix

on:
  push:
    branches: [feat/competitor-radar-testable-preview]
    paths: [.github/workflows/apply-radar-mobile-tab-fix.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/competitor-radar-testable-preview
          fetch-depth: 0
      - name: Scope browser clicks to the platform navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/tests/radar-preview-browser.cjs')
          text = path.read_text()
          replacements = {
              "await page.getByRole('button', { name: 'A. Agoda', exact: true }).click();": "await page.locator('nav[aria-label=\"平台切換\"] button').filter({ hasText: 'Agoda' }).click();",
              "await phone.getByRole('button', { name: 'B. Booking.com', exact: true }).click();": "await phone.locator('nav[aria-label=\"平台切換\"] button').filter({ hasText: 'Booking.com' }).click();",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one selector: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git add frontend/tests/radar-preview-browser.cjs
          git diff --cached --check
          grep -F "nav[aria-label=\"平台切換\"] button" frontend/tests/radar-preview-browser.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: scope radar channel clicks to tab navigation'
          git push origin HEAD:feat/competitor-radar-testable-preview
