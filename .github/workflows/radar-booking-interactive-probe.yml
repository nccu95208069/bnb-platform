name: Radar Booking Interactive Probe

# Historical research only; never runs on a source commit.
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VERCEL_TEAM_ID: team_rtARGegsahiZ6hOY7l2dUWGw
      VERCEL_PROJECT_ID: prj_5a6ilBSvneWYIDTGoCFFZhAjWYeM
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          mkdir -p /tmp/booking-interactive && cd /tmp/booking-interactive
          npm init -y >/dev/null
          npm install --save-exact @vercel/sandbox >/dev/null
      - name: Select dates, apply changes, and inspect first room quote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: /tmp/booking-interactive
        run: |
          cat > probe.mjs <<'JS'
          import { Sandbox } from '@vercel/sandbox';
          import { writeFile } from 'node:fs/promises';
          const sandbox=await Sandbox.create({token:process.env.VERCEL_TOKEN,teamId:process.env.VERCEL_TEAM_ID,projectId:process.env.VERCEL_PROJECT_ID,source:{type:'snapshot',snapshotId:'snap_c3rDmQdTPMoDHIu55bxS3MruQxZz'},timeout:6*60*1000,resources:{vcpus:2},networkPolicy:'allow-all'});
          async function cmd(args,limit=900000){const r=await sandbox.runCommand({cmd:'agent-browser',args});const out=(await r.stdout()).slice(0,limit);const err=(await r.stderr()).slice(0,5000);if(r.exitCode)throw new Error(err);return out}
          async function evaluate(source,limit){return cmd(['eval',source],limit)}
          const evidence={};
          try {
            await cmd(['open','https://www.booking.com/hotel/tw/shui-fang-sweetfun-rui-fang-jiu-fen.zh-tw.html']);
            await cmd(['wait','7000']);
            evidence.openPicker=await evaluate(`(()=>{const buttons=[...document.querySelectorAll('button')].filter(x=>/選擇日期|入住日/.test((x.innerText||'')+(x.getAttribute('aria-label')||'')));buttons.at(-1)?.click();return JSON.stringify({count:buttons.length})})()`);
            await cmd(['wait','500']);
            for (const day of ['2026-09-15','2026-09-16']) {
              evidence[day]=await evaluate(`(()=>{const all=[...document.querySelectorAll('[data-date="${day}"]')];const target=all.find(x=>!x.closest('[aria-disabled="true"]')&&!x.hasAttribute('disabled'));if(!target)return JSON.stringify({found:all.length,clicked:false});(target.closest('button')||target).click();return JSON.stringify({found:all.length,clicked:true})})()`);
              await cmd(['wait','700']);
            }
            evidence.beforeUpdate=await evaluate(`JSON.stringify({selected:[...document.querySelectorAll('button')].map(x=>(x.innerText||'').trim()).filter(x=>/9 月 15 日|9 月 16 日/.test(x)),actions:[...document.querySelectorAll('button,a,[role="button"]')].map((x,i)=>({i,text:(x.innerText||x.textContent||'').trim(),aria:x.getAttribute('aria-label')})).filter(x=>/更新變更|搜尋|顯示價格/.test((x.text||'')+(x.aria||''))).slice(0,80)})`);
            evidence.update=await evaluate(`(()=>{const x=[...document.querySelectorAll('button,a,[role="button"]')].find(x=>/^更新變更$/.test((x.innerText||x.textContent||'').trim()));if(!x)return JSON.stringify({clicked:false});x.scrollIntoView({block:'center'});x.click();return JSON.stringify({clicked:true})})()`);
            await cmd(['wait','--load','networkidle']);await cmd(['wait','9000']);
            evidence.afterUpdate=await evaluate(`JSON.stringify({url:location.href,title:document.title,selected:[...document.querySelectorAll('button')].map(x=>(x.innerText||'').trim()).filter(x=>/9 月 15 日|9 月 16 日/.test(x)),body:(document.body.innerText||'').slice(0,170000),table:document.querySelector('#hprt-table')?.innerText||'',priceButtons:[...document.querySelectorAll('button,a,[role="button"]')].map((x,i)=>({i,text:(x.innerText||x.textContent||'').trim(),aria:x.getAttribute('aria-label'),html:x.outerHTML.slice(0,2000)})).filter(x=>/顯示價格/.test((x.text||'')+(x.aria||''))).slice(0,20),resources:performance.getEntriesByType('resource').map(x=>x.name).filter(x=>/avail|room|price|block|graphql/i.test(x)).slice(-180)})`,900000);
            evidence.show=await evaluate(`(async()=>{const x=[...document.querySelectorAll('button,a,[role="button"]')].find(x=>/^顯示價格$/.test((x.innerText||x.textContent||'').trim()));if(!x)return JSON.stringify({clicked:false});x.scrollIntoView({block:'center'});x.click();await new Promise(r=>setTimeout(r,5000));return JSON.stringify({clicked:true})})()`);
            evidence.afterShow=await evaluate(`JSON.stringify({url:location.href,title:document.title,body:(document.body.innerText||'').slice(0,200000),table:document.querySelector('#hprt-table')?.innerText||'',dialogs:[...document.querySelectorAll('[role="dialog"],dialog')].map(x=>(x.innerText||'').slice(0,60000)),prices:[...document.querySelectorAll('[class*="price"],[data-testid*="price"]')].map(x=>(x.innerText||x.textContent||'').trim()).filter(Boolean).slice(0,250),resources:performance.getEntriesByType('resource').map(x=>x.name).filter(x=>/avail|room|price|block|graphql/i.test(x)).slice(-220)})`,900000);
          } finally {
            await sandbox.runCommand({cmd:'agent-browser',args:['close']}).catch(()=>undefined);
            await sandbox.stop().catch(()=>undefined);
          }
          await writeFile('booking-interactive.json',JSON.stringify(evidence,null,2));
          console.log(JSON.stringify({openPicker:evidence.openPicker,checkin:evidence['2026-09-15'],checkout:evidence['2026-09-16'],update:evidence.update,show:evidence.show,afterUpdate:String(evidence.afterUpdate).slice(0,120000),afterShow:String(evidence.afterShow).slice(0,120000)},null,2));
          JS
          node probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-booking-interactive-probe
          path: /tmp/booking-interactive/booking-interactive.json
          retention-days: 7
