[project]
name = "bnb-line-oa-host-runtime"
version = "0.1.0"
description = "Owner-paired local host companion for LINE OA browser sessions"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "playwright>=1.56,<2",
  "line-bot-sdk>=3.14,<4",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "ruff>=0.8"]

[tool.uv]
package = false
